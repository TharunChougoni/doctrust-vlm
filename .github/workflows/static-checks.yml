name: Static checks

on:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests scripts
      - name: Compile Python source without importing model dependencies
        run: python -m compileall -q src tests scripts
      - name: Lightweight unit tests
        run: PYTHONPATH=src pytest -q
