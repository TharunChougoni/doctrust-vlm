seed: 17

model:
  name: qwen2.5-vl-3b
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  architecture: image_text_to_text
  load_in_4bit: false
  dtype: float16
  processor_use_fast: false
  min_pixels: 200704
  max_pixels: 1003520
  max_new_tokens: 64
  prompt: >-
    Answer the question using only visible evidence in the document.
    Return only the short answer. If the answer evidence is absent,
    covered, destroyed, or unreadable, return exactly UNANSWERABLE.

runtime:
  batch_size: 1
  seed: 17

data:
  source_manifest: data/manifests/source.jsonl
  prepared_manifest: data/manifests/prepared_colab.jsonl
  generated_dir: data/generated_colab
  max_long_edge: 1536

variants:
  - name: clean
    expected_behavior: preserve
  - name: jpeg_q35
    expected_behavior: preserve
    transform: jpeg
    quality: 35
  - name: blur_1_5
    expected_behavior: preserve
    transform: gaussian_blur
    radius: 1.5
  - name: distractor_occlusion
    expected_behavior: preserve
    transform: distractor_occlusion
    fill: 128
  - name: evidence_occlusion
    expected_behavior: abstain
    transform: evidence_occlusion
    fill: 128

output:
  predictions: results/qwen_predictions.jsonl
  metrics: results/qwen_metrics.json
  error_analysis: results/qwen_error_analysis.jsonl
